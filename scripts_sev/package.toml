speech = { package = "model.speech", path = "../../../../../../Documents/Severian/library/model/speech", version = "0.1.0" }
mysql = { path = "../../../../../../Documents/Severian/library/mysql", version = "0.1.0" }
os = { path = "../../../../../../Documents/Severian/library/os", version = "0.1.0" }
path = { path = "../../../../../../Documents/Severian/library/path", version = "0.1.0" }
process = { path = "../../../../../../Documents/Severian/library/process", version = "0.1.0" }
